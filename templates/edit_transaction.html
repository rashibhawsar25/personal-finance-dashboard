<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Transaction</title>
</head>
<body>

    <h1>Edit Transaction</h1>

    <form method="POST">

        <label>Amount:</label>
        <input type="number" step="0.01"
               name="amount"
               value="{{ transaction.amount }}"
               required>

        <br><br>

        <label>Type:</label>
        <select name="type">
            <option value="income"
                {% if transaction.type == "income" %}selected{% endif %}>
                Income
            </option>

            <option value="expense"
                {% if transaction.type == "expense" %}selected{% endif %}>
                Expense
            </option>
        </select>

        <br><br>

        <label>Category:</label>
        <input type="text"
               name="category"
               value="{{ transaction.category }}"
               required>

        <br><br>

        <label>Description:</label>
        <input type="text"
               name="description"
               value="{{ transaction.description }}">

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('transactions') }}">Back to Transactions</a>

</body>
</html>
